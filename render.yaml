# ===========================================================================
# MarketSphere — Render Blueprint (Infrastructure as Code)
# ===========================================================================
# Render reads this file to provision services. Commit it, then in the
# Render dashboard: New → Blueprint → point to your GitHub repo.
#
# Docs: https://docs.render.com/infrastructure-as-code
# ===========================================================================

databases:
  - name: marketsphere-db
    plan: free # 90-day free tier; upgrade to starter ($7/mo) for persistence
    databaseName: marketsphere_prod
    user: marketsphere
    region: oregon # closest Render region to India with free tier
    postgresMajorVersion: "16"

services:
  # ---- Express API Server ----
  - type: web
    name: marketsphere-api
    runtime: node
    region: oregon
    plan: free # 750 free hours/mo; upgrade to starter ($7/mo) for always-on
    buildCommand: chmod +x scripts/render-build.sh && ./scripts/render-build.sh
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: marketsphere-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        sync: false # set manually after Vercel deploy
      - key: CSRF_ALLOWED_ORIGINS
        sync: false # set to Vercel URL after deploy
      - key: LOG_LEVEL
        value: info
      - key: PORT
        value: "3001"
